name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No install step: the plugin has no runtime or dev dependencies, and
      # lib/ is committed. The suite also proves lib/ still matches src/.
      - name: node --test
        run: node --test
